name: Validate

on:
  push: 
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # topics - проверка на попадание в ОБЩИЙ КАТАЛОГ HACS, а не на
          # работоспособность интеграции. Форк ставится как custom repository и в
          # каталог не идёт, а прогон красил красным каждую ночь с 29.06: 43 подряд,
          # ни одного зелёного. Постоянная краснота прячет настоящую поломку.
          # Вторая падавшая проверка (issues) чинится по корню - Issues в репозитории
          # включены 10.08, чтобы сигнал о конфликте слияния мог завести задачу.
          ignore: "topics"
